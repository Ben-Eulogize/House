<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>49 Balls Head Road, Waverton — Colour Visualiser</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;overflow:hidden;height:100vh}
nav{display:flex;background:#1e293b;border-bottom:2px solid #334155;height:48px}
nav button{flex:1;background:none;border:none;color:#64748b;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
nav button:hover{color:#94a3b8;background:rgba(255,255,255,.03)}
nav button.active{color:#f1f5f9;background:#0f172a;border-bottom:3px solid #3b82f6}
.tab{display:none;width:100%;height:calc(100vh - 48px);position:relative;overflow:hidden}
.tab.active{display:flex;align-items:center;justify-content:center}
.panel{position:absolute;z-index:10;background:rgba(15,23,42,.94);padding:12px 16px;border-radius:8px;font-size:12px;border:1px solid #334155;backdrop-filter:blur(8px)}
.panel h4{font-size:13px;margin-bottom:8px;color:#93c5fd}
.btn-group{display:flex;gap:4px;flex-wrap:wrap}
.btn{background:rgba(30,41,59,.95);color:#94a3b8;border:1px solid #334151;padding:7px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;transition:all .15s;white-space:nowrap}
.btn:hover{color:#cbd5e1;background:rgba(51,65,85,.8)}
.btn.active{color:#f1f5f9;background:#1e3a5f;border-color:#3b82f6}
.page-controls{position:absolute;top:12px;left:12px;z-index:10}
.loading{color:#94a3b8;font-size:16px;text-align:center}
.loading small{display:block;margin-top:8px;font-size:12px;color:#64748b}

/* Elevations tab specifics */
#elev-panel{position:absolute;top:12px;right:12px;max-width:260px;max-height:calc(100vh - 80px);overflow-y:auto}
.mat-row{display:flex;align-items:center;margin-bottom:6px;padding:4px 8px;border-radius:4px;cursor:pointer;transition:background .15s}
.mat-row:hover{background:rgba(255,255,255,.06)}
.mat-row.active{background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.3)}
.mat-swatch{width:22px;height:22px;border-radius:4px;margin-right:10px;border:1px solid #475569;flex-shrink:0;cursor:pointer}
.mat-name{font-size:12px;line-height:1.3}
.mat-code{font-size:10px;color:#64748b}
.note{color:#f59e0b;margin-top:8px;font-size:11px;line-height:1.4}
#trace-bar{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:10;display:none;gap:8px;align-items:center;border-color:#f59e0b}
#trace-bar.show{display:flex}
#trace-bar select,#trace-bar .btn{font-size:11px;padding:4px 8px}

/* Renders tab */
#render-info{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:10;text-align:center}

canvas{display:block}
</style>
</head>
<body>

<nav>
<button class="active" data-tab="elevations">Elevations &amp; Colours</button>
<button data-tab="plans">Floor Plans</button>
<button data-tab="renders">3D Renders</button>
</nav>

<!-- ═══════ TAB 1: ELEVATIONS WITH COLOUR SWAP (main feature) ═══════ -->
<div id="tab-elevations" class="tab active">
<div class="page-controls btn-group" id="elev-controls">
<button class="btn active" data-elev="WN">West &amp; North</button>
<button class="btn" data-elev="ES">East &amp; South</button>
</div>
<div id="elev-panel" class="panel">
<h4>Exterior Colours</h4>
<div id="mat-list"></div>
<div class="note" id="elev-hint">Trace mode: add ?edit=1 to URL to define colour regions on the elevations.</div>
</div>
<div class="loading" id="elev-loading">Loading elevations...<small>DA Plans Rev K (9.6 MB)</small></div>
<canvas id="elev-canvas" style="display:none"></canvas>
<div id="trace-bar" class="panel">
<span style="color:#f59e0b;font-weight:600">Trace Mode</span>
<select id="trace-mat"></select>
<button class="btn" id="btn-undo">Undo Pt</button>
<button class="btn" id="btn-close-poly">Close Shape</button>
<button class="btn" id="btn-delete-last">Delete Last</button>
<button class="btn" id="btn-export">Export JSON</button>
<button class="btn" id="btn-clear">Clear All</button>
</div>
</div>

<!-- ═══════ TAB 2: FLOOR PLANS (PDF pages) ═══════ -->
<div id="tab-plans" class="tab">
<div class="page-controls btn-group" id="plans-controls">
<button class="btn" data-page="3">Site Plan</button>
<button class="btn active" data-page="4">Lower Ground</button>
<button class="btn" data-page="5">Ground Floor</button>
<button class="btn" data-page="6">First Floor</button>
</div>
<div class="loading" id="plans-loading">Loading floor plans...</div>
<canvas id="plans-canvas" style="display:none"></canvas>
</div>

<!-- ═══════ TAB 3: 3D RENDERS (from architect, PDF page 1) ═══════ -->
<div id="tab-renders" class="tab">
<div class="loading" id="renders-loading">Loading 3D renders...</div>
<canvas id="renders-canvas" style="display:none"></canvas>
<div id="render-info" class="panel">
<h4>Architect's 3D Renders</h4>
<div style="color:#94a3b8;font-size:11px">From DA Plans Rev K, Page 1 — Horizon Homes J1672</div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.min.js"></script>
<script>
'use strict';

// ══════════════════════════════════════════
// COLOUR DATA — single source of truth
// ══════════════════════════════════════════
var COLOURS = {
  render:   {name:'Dulux Grey Pebble Half',   hex:'#cec8c1', code:'S14B1H'},
  monument: {name:'Colorbond Monument',       hex:'#3d4040', code:'MON'},
  surfmist: {name:'Colorbond Surfmist',       hex:'#e8e1d4', code:'SUR'},
  timber:   {name:'Pacific Maple',            hex:'#8b6f47', code:'PMP'},
  brick:    {name:'Selected Brick',           hex:'#9a8878', code:'BRK'},
  glazing:  {name:'Aluminium Monument',       hex:'#3d4040', code:'ALU'},
  glass:    {name:'Glass',                    hex:'#8ec8d8', code:'GLS'},
  roof:     {name:'Colorbond Surfmist (Roof)',hex:'#e8e1d4', code:'SRF'}
};

var PDF_FILE = 'J1672 - Lot 29, No-49 Balls Head Road, Waverton - DA PLANS - REV K.pdf';
var pdfDoc = null;
var pdfLoading = false;

// ══════════════════════════════════════════
// PDF LOADER (shared across all tabs)
// ══════════════════════════════════════════
function loadPdf(callback) {
  if (pdfDoc) { callback(pdfDoc); return; }
  if (pdfLoading) { var iv=setInterval(function(){if(pdfDoc){clearInterval(iv);callback(pdfDoc);}},200); return; }
  pdfLoading = true;

  if (typeof pdfjsLib === 'undefined') {
    document.querySelectorAll('.loading').forEach(function(el){
      el.innerHTML = 'PDF library not loaded.<small>Check internet connection or serve via HTTP.</small>';
    });
    return;
  }

  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.worker.min.js';
  pdfjsLib.getDocument(PDF_FILE).promise.then(function(pdf) {
    pdfDoc = pdf;
    callback(pdf);
  }).catch(function(err) {
    document.querySelectorAll('.loading').forEach(function(el){
      el.innerHTML = 'Failed to load PDF: ' + err.message + '<small>Serve page via HTTP, not file://</small>';
    });
  });
}

function renderPage(pdf, pageNum, canvas, container, callback) {
  pdf.getPage(pageNum).then(function(page) {
    var cw = container.clientWidth, ch = container.clientHeight;
    var vp = page.getViewport({scale:1});
    var scale = Math.min(cw/vp.width, ch/vp.height) * 0.92;
    var viewport = page.getViewport({scale:scale});
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    canvas.style.display = 'block';
    var ctx = canvas.getContext('2d');
    page.render({canvasContext:ctx, viewport:viewport}).promise.then(function(){
      if(callback) callback(ctx);
    });
  });
}

// ══════════════════════════════════════════
// TAB SWITCHING
// ══════════════════════════════════════════
var activeTab = 'elevations';
var tabInited = {};

document.querySelectorAll('nav button').forEach(function(b){
  b.addEventListener('click', function(){ switchTab(b.dataset.tab); });
});

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('nav button').forEach(function(b){
    b.classList.toggle('active', b.dataset.tab===tab);
  });
  document.querySelectorAll('.tab').forEach(function(t){
    t.classList.toggle('active', t.id==='tab-'+tab);
  });
  if (!tabInited[tab]) {
    tabInited[tab] = true;
    loadPdf(function(pdf){
      if (tab==='elevations') initElevations(pdf);
      else if (tab==='plans') initPlans(pdf);
      else if (tab==='renders') initRenders(pdf);
    });
  }
}

// ══════════════════════════════════════════
// TAB 1: ELEVATIONS WITH COLOUR SWAP
// ══════════════════════════════════════════
var elevCanvas, elevCtx, elevBaseImage = null;
var currentElevPage = 'WN';
var elevPageMap = {WN:7, ES:8};
var editMode = location.search.indexOf('edit=1') !== -1;
var ELEV_REGIONS = {WN:[], ES:[]};
var currentPoly = [];
var selectedMaterial = 'render';

function initElevations(pdf) {
  elevCanvas = document.getElementById('elev-canvas');
  elevCtx = elevCanvas.getContext('2d');

  // Build material panel
  var matList = document.getElementById('mat-list');
  var html = '';
  Object.keys(COLOURS).forEach(function(k){
    var c = COLOURS[k];
    html += '<div class="mat-row'+(k===selectedMaterial?' active':'')+'" data-mat="'+k+'">'
      + '<div class="mat-swatch" style="background:'+c.hex+'" title="Click to pick alternative"></div>'
      + '<div><div class="mat-name">'+c.name+'</div><div class="mat-code">'+c.code+'</div></div></div>';
  });
  matList.innerHTML = html;

  matList.querySelectorAll('.mat-row').forEach(function(row){
    row.addEventListener('click', function(){
      selectedMaterial = row.dataset.mat;
      matList.querySelectorAll('.mat-row').forEach(function(r){r.classList.remove('active');});
      row.classList.add('active');
      if(editMode) document.getElementById('trace-mat').value = selectedMaterial;
    });
  });

  // Page selector
  document.querySelectorAll('#elev-controls .btn').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('#elev-controls .btn').forEach(function(bb){bb.classList.remove('active');});
      b.classList.add('active');
      currentElevPage = b.dataset.elev;
      currentPoly = [];
      loadElevPage(pdf);
    });
  });

  // Trace mode
  if (editMode) {
    document.getElementById('trace-bar').classList.add('show');
    document.getElementById('elev-hint').textContent = 'Trace mode active. Click to place vertices, close shape, tag with material.';

    var sel = document.getElementById('trace-mat');
    Object.keys(COLOURS).forEach(function(k){
      var o = document.createElement('option'); o.value=k; o.textContent=COLOURS[k].name; sel.appendChild(o);
    });
    sel.value = selectedMaterial;
    sel.addEventListener('change', function(){ selectedMaterial = sel.value; });

    elevCanvas.addEventListener('click', function(e){
      var r = elevCanvas.getBoundingClientRect();
      var x = (e.clientX - r.left) * (elevCanvas.width / r.width);
      var y = (e.clientY - r.top) * (elevCanvas.height / r.height);
      currentPoly.push([Math.round(x), Math.round(y)]);
      drawElevOverlay();
    });

    elevCanvas.addEventListener('dblclick', function(e){
      e.preventDefault();
      closeTracePoly();
    });

    document.getElementById('btn-undo').addEventListener('click', function(){
      currentPoly.pop(); drawElevOverlay();
    });
    document.getElementById('btn-close-poly').addEventListener('click', closeTracePoly);
    document.getElementById('btn-delete-last').addEventListener('click', function(){
      ELEV_REGIONS[currentElevPage].pop(); drawElevOverlay();
    });
    document.getElementById('btn-export').addEventListener('click', function(){
      var json = JSON.stringify(ELEV_REGIONS, null, 2);
      if (navigator.clipboard) {
        navigator.clipboard.writeText(json).then(function(){alert('Copied to clipboard!');});
      } else { prompt('Copy this JSON:', json); }
    });
    document.getElementById('btn-clear').addEventListener('click', function(){
      ELEV_REGIONS[currentElevPage] = []; currentPoly = []; drawElevOverlay();
    });
  }

  loadElevPage(pdf);
}

function closeTracePoly() {
  if (currentPoly.length < 3) return;
  ELEV_REGIONS[currentElevPage].push({
    material: selectedMaterial,
    pts: currentPoly.slice()
  });
  currentPoly = [];
  drawElevOverlay();
}

function loadElevPage(pdf) {
  document.getElementById('elev-loading').style.display = 'block';
  elevCanvas.style.display = 'none';
  var container = document.getElementById('tab-elevations');
  renderPage(pdf, elevPageMap[currentElevPage], elevCanvas, container, function(){
    document.getElementById('elev-loading').style.display = 'none';
    elevBaseImage = elevCtx.getImageData(0, 0, elevCanvas.width, elevCanvas.height);
    drawElevOverlay();
  });
}

function drawElevOverlay() {
  if (!elevBaseImage) return;
  elevCtx.putImageData(elevBaseImage, 0, 0);

  // Draw saved regions
  var regions = ELEV_REGIONS[currentElevPage] || [];
  regions.forEach(function(r){
    var c = COLOURS[r.material];
    if (!c) return;
    elevCtx.fillStyle = c.hex + '55';
    elevCtx.strokeStyle = c.hex;
    elevCtx.lineWidth = 2;
    elevCtx.beginPath();
    r.pts.forEach(function(p,i){ i===0 ? elevCtx.moveTo(p[0],p[1]) : elevCtx.lineTo(p[0],p[1]); });
    elevCtx.closePath();
    elevCtx.fill();
    elevCtx.stroke();
    // Label
    var cx = r.pts.reduce(function(s,p){return s+p[0];},0)/r.pts.length;
    var cy = r.pts.reduce(function(s,p){return s+p[1];},0)/r.pts.length;
    elevCtx.fillStyle = '#fff';
    elevCtx.font = 'bold 11px sans-serif';
    elevCtx.textAlign = 'center';
    elevCtx.fillText(COLOURS[r.material].name, cx, cy);
  });

  // Draw current polygon being traced
  if (currentPoly.length > 0) {
    elevCtx.strokeStyle = '#f59e0b';
    elevCtx.lineWidth = 2;
    elevCtx.setLineDash([5,3]);
    elevCtx.beginPath();
    currentPoly.forEach(function(p,i){ i===0 ? elevCtx.moveTo(p[0],p[1]) : elevCtx.lineTo(p[0],p[1]); });
    elevCtx.stroke();
    elevCtx.setLineDash([]);

    elevCtx.fillStyle = '#f59e0b';
    currentPoly.forEach(function(p){
      elevCtx.beginPath();
      elevCtx.arc(p[0], p[1], 5, 0, Math.PI*2);
      elevCtx.fill();
    });

    // Close-preview line
    if (currentPoly.length > 2) {
      elevCtx.strokeStyle = 'rgba(245,158,11,0.4)';
      elevCtx.setLineDash([3,3]);
      elevCtx.beginPath();
      var last = currentPoly[currentPoly.length-1], first = currentPoly[0];
      elevCtx.moveTo(last[0],last[1]);
      elevCtx.lineTo(first[0],first[1]);
      elevCtx.stroke();
      elevCtx.setLineDash([]);
    }
  }
}

// ══════════════════════════════════════════
// TAB 2: FLOOR PLANS (actual PDF pages)
// ══════════════════════════════════════════
var plansCanvas, plansCtx;
var currentPlanPage = 4;

function initPlans(pdf) {
  plansCanvas = document.getElementById('plans-canvas');
  plansCtx = plansCanvas.getContext('2d');

  document.querySelectorAll('#plans-controls .btn').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('#plans-controls .btn').forEach(function(bb){bb.classList.remove('active');});
      b.classList.add('active');
      currentPlanPage = parseInt(b.dataset.page);
      loadPlanPage(pdf);
    });
  });

  loadPlanPage(pdf);
}

function loadPlanPage(pdf) {
  document.getElementById('plans-loading').style.display = 'block';
  plansCanvas.style.display = 'none';
  var container = document.getElementById('tab-plans');
  renderPage(pdf, currentPlanPage, plansCanvas, container, function(){
    document.getElementById('plans-loading').style.display = 'none';
  });
}

// ══════════════════════════════════════════
// TAB 3: 3D RENDERS (architect's page 1)
// ══════════════════════════════════════════
function initRenders(pdf) {
  var canvas = document.getElementById('renders-canvas');
  var container = document.getElementById('tab-renders');
  renderPage(pdf, 1, canvas, container, function(){
    document.getElementById('renders-loading').style.display = 'none';
  });
}

// ══════════════════════════════════════════
// WINDOW RESIZE
// ══════════════════════════════════════════
window.addEventListener('resize', function(){
  if (!pdfDoc) return;
  if (activeTab==='elevations') loadElevPage(pdfDoc);
  else if (activeTab==='plans') loadPlanPage(pdfDoc);
  else if (activeTab==='renders') {
    var c = document.getElementById('renders-canvas');
    var container = document.getElementById('tab-renders');
    renderPage(pdfDoc, 1, c, container);
  }
});

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
switchTab('elevations');
</script>
</body>
</html>
