<script>

function(){return function(dX,dY){var el=s.domElement;if(s.object.isPerspectiveCamera){var ov=new THREE.Vector3;ov.copy(s.object.position).sub(s.target);var tD=ov.length()*Math.tan(s.object.fov/2*Math.PI/180);panL(2*dX*tD/el.clientHeight,s.object.matrix);panU(2*dY*tD/el.clientHeight,s.object.matrix)}}}();function dIn(ds){scl/=ds}function dOut(ds){scl*=ds}function onMD(e){if(!s.enabled)return;e.preventDefault();if(e.button===0){state=S.ROTATE;rS.set(e.clientX,e.clientY)}else if(e.button===1){state=S.DOLLY;dS.set(e.clientX,e.clientY)}else if(e.button===2){state=S.PAN;pS.set(e.clientX,e.clientY)}if(state!==S.NONE){document.addEventListener('mousemove',onMM,false);document.addEventListener('mouseup',onMU,false)}}function onMM(e){if(!s.enabled)return;e.preventDefault();if(state===S.ROTATE){rE.set(e.clientX,e.clientY);rD.subVectors(rE,rS);rL(2*Math.PI*rD.x/d.clientHeight*s.rotateSpeed);rU(2*Math.PI*rD.y/d.clientHeight*s.rotateSpeed);rS.copy(rE)}else if(state===S.DOLLY){dE.set(e.clientX,e.clientY);dD.subVectors(dE,dS);if(dD.y>0)dIn(Math.pow(0.95,s.zoomSpeed));else if(dD.y<0)dOut(Math.pow(0.95,s.zoomSpeed));dS.copy(dE)}else if(state===S.PAN){pE.set(e.clientX,e.clientY);pD.subVectors(pE,pS);pan(pD.x,pD.y);pS.copy(pE)}s.update()}function onMU(){document.removeEventListener('mousemove',onMM,false);document.removeEventListener('mouseup',onMU,false);state=S.NONE}function onW(e){if(!s.enabled||!s.enableZoom)return;e.preventDefault();e.stopPropagation();if(e.deltaY<0)dOut(Math.pow(0.95,s.zoomSpeed));else if(e.deltaY>0)dIn(Math.pow(0.95,s.zoomSpeed));s.update()}function onTS(e){if(!s.enabled)return;switch(e.touches.length){case 1:state=S.ROTATE;rS.set(e.touches[0].pageX,e.touches[0].pageY);break;case 2:state=S.DOLLY;var dx=e.touches[0].pageX-e.touches[1].pageX,dy=e.touches[0].pageY-e.touches[1].pageY;dS.set(0,Math.sqrt(dx*dx+dy*dy));break}}function onTM(e){if(!s.enabled)return;e.preventDefault();e.stopPropagation();switch(e.touches.length){case 1:rE.set(e.touches[0].pageX,e.touches[0].pageY);rD.subVectors(rE,rS);rL(2*Math.PI*rD.x/d.clientHeight*s.rotateSpeed);rU(2*Math.PI*rD.y/d.clientHeight*s.rotateSpeed);rS.copy(rE);break;case 2:var dx=e.touches[0].pageX-e.touches[1].pageX,dy=e.touches[0].pageY-e.touches[1].pageY;dE.set(0,Math.sqrt(dx*dx+dy*dy));dD.subVectors(dE,dS);if(dD.y>0)dOut(Math.pow(0.95,s.zoomSpeed));else if(dD.y<0)dIn(Math.pow(0.95,s.zoomSpeed));dS.copy(dE);break}s.update()}d.addEventListener('mousedown',onMD,false);d.addEventListener('wheel',onW,{passive:false});d.addEventListener('touchstart',onTS,{passive:false});d.addEventListener('touchmove',onTM,{passive:false});d.addEventListener('touchend',function(){state=S.NONE},false);d.addEventListener('contextmenu',function(e){e.preventDefault()},false);this.update()};
// ── END OrbitControls ──
</script>
<script>
// ══════════════════════════════════════════════════════════════════
// 49 Balls Head Road, Waverton — 3D House Model (Rev S construction set)
// Coordinate system: X+=East, X-=West, Z+=North(street/high), Z-=South(harbour/low), Y+=Up
// Datum: Y=0 = RL 28.890 (Lower Ground floor SFL). All dimensions metres.
// Y(RL) = RL - 28.890
// Key levels: LGF 0.0 (ceil 3.0) · GF 3.45 (ceil 6.2) · FF 6.65 (ceil 9.25)
//             Ridge 10.08 (RL 38.970, high street edge of 5° skillion)
//             Garage 3.364 · Porch 3.364 · Alfresco -0.086
//             Front balc 6.564 · Rear balc 6.50 · Parapet 7.00 (RL 35.890)
// Envelopes:  LGF x ±6.005, z -9.355..+9.355 (east face inset .405 for z<-2.03,
//             west stair lightwell notch to x=-3.365 for z 0.84..3.37,
//             alfresco void SW x -5.775..+0.575, z -9.355..-5.355)
//             GF  x ±6.005, z -9.355(east half)/-6.28(west half)..+11.665
//             FF  x -3.345..+4.915, z +0.095..+11.665 (185 EPS walls)
// Roofs: main 5° skillion high at street (ridge z=+11.97), falling to garden;
//        GF garden 5° skillion under FF; 2° box-gutter strips both sides.
// ══════════════════════════════════════════════════════════════════

// ── Colours (selections schedule) ──
var C = {
  render:   0xcec8c1, // Dulux Grey Pebble 1/2 Str (acrylic render)
  monument: 0x3d4040, // Colorbond Monument
  axon:     0x373a3a, // Scyon Axon Monument (FF street facade)
  surfmist: 0xe8e1d4, // Colorbond Surfmist
  timber:   0x8b6f47, // Pacific Maple
  glass:    0x9fc9d8,
  concrete: 0xb0a898,
  plaster:  0xf1eee8,
  tFloor:   0xa8865c, // engineered timber
  tile:     0xd9d3c9, // porcelain tile
  wetTile:  0xccd3d1,
  carpet:   0xb7b0a2,
  darkTimber:0x5a442f,
  bench:    0xe9e6df,
  black:    0x22252a,
  water:    0x6fb3c8,
  lawn:     0x71905c,
  drive:    0x9a948b,
  retain:   0x8f887c
};
function mat(c, r, m, extra){
  var p = {color:c, roughness:(r===undefined?0.85:r), metalness:(m||0)};
  if (extra) for (var k in extra) p[k]=extra[k];
  return new THREE.MeshStandardMaterial(p);
}
var M = {
  render:   mat(C.render, .88),
  monument: mat(C.monument, .55, .1),
  axon:     mat(C.axon, .6, .05),
  surfmist: mat(C.surfmist, .45, .15),
  timber:   mat(C.timber, .7),
  glass:    mat(C.glass, .08, .1, {transparent:true, opacity:0.32, side:THREE.DoubleSide}),
  glassOp:  mat(0xc8d4d2, .3, 0, {transparent:true, opacity:0.75}), // opaque glazing W22
  concrete: mat(C.concrete, .92),
  plaster:  mat(C.plaster, .95),
  tFloor:   mat(C.tFloor, .6),
  tile:     mat(C.tile, .4),
  wetTile:  mat(C.wetTile, .35),
  carpet:   mat(C.carpet, 1.0),
  darkTimber:mat(C.darkTimber, .6),
  bench:    mat(C.bench, .3),
  black:    mat(C.black, .4, .3),
  water:    mat(C.water, .1, .1, {transparent:true, opacity:0.85}),
  lawn:     mat(C.lawn, 1.0),
  drive:    mat(C.drive, .95),
  retain:   mat(C.retain, .9),
  pv:       mat(0x1a1a2e, .3, .6),
  white:    mat(0xf7f6f2, .35)
};

// ── Scene ──
var scene = new THREE.Scene();
scene.background = new THREE.Color(0x9cc4e0);
scene.fog = new THREE.Fog(0x9cc4e0, 90, 220);
var camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.08, 400);
camera.position.set(21, 14, -25);
var renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);
var controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.target.set(0, 4, 0);
controls.minDistance = 2; controls.maxDistance = 90;

scene.add(new THREE.AmbientLight(0xffffff, 0.42));
var sun = new THREE.DirectionalLight(0xfff4e0, 1.05);
sun.position.set(18, 30, -14);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left=-24; sun.shadow.camera.right=24;
sun.shadow.camera.top=26; sun.shadow.camera.bottom=-20;
sun.shadow.bias = -0.0004;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xdde8f5, 0x8b7d6b, 0.5));
// soft interior fill so walkthrough isn't black
var fill = new THREE.DirectionalLight(0xffffff, 0.22);
fill.position.set(-10, 12, 8);
scene.add(fill);

var house = new THREE.Group(); scene.add(house);

// ── Collision / floor registries ──
var colliders = [];   // {x0,x1,y0,y1,z0,z1}
var slabs = [];       // walkable flats {x0,x1,z0,z1,y}
var ramps = [];       // walkable slopes along x: {x0,x1,z0,z1,ya(at x0),yb(at x1)}
var rampsZ = [];      // walkable slopes along z: {x0,x1,z0,z1,ya(at z0),yb(at z1)}

function bx(w,h,d,material){
  var m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), material);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function box(x0,x1,y0,y1,z0,z1,material,noCollide){
  var m = bx(x1-x0, y1-y0, z1-z0, material);
  m.position.set((x0+x1)/2, (y0+y1)/2, (z0+z1)/2);
  house.add(m);
  if (!noCollide) colliders.push({x0:x0,x1:x1,y0:y0,y1:y1,z0:z0,z1:z1});
  return m;
}
function slab(x0,x1,z0,z1,y,thk,material){
  var m = box(x0,x1,y-(thk||0.2),y,z0,z1,material,true);
  slabs.push({x0:x0,x1:x1,z0:z0,z1:z1,y:y});
  return m;
}

// ── Wall builder with real openings ──
// o: {along:'z'|'x', at, from, to, y0, y1, thk, mat, opens:[{c,w,sill,h,type}]}
// opens types: 'win' glass+frame, 'winOp' opaque glass, 'door' free opening,
// 'glassdoor' fixed glass panes + walk gap, 'leaf' timber leaf ajar, 'garage' panel
function wall(o){
  var t = o.thk, m = o.mat, a=o.from, b=o.to, y0=o.y0, y1=o.y1;
  var opens = (o.opens||[]).slice().sort(function(p,q){return p.c-q.c;});
  function seg(u0,u1,yy0,yy1){
    if (u1-u0 < 0.012 || yy1-yy0 < 0.012) return;
    if (o.along==='z') box(o.at-t/2, o.at+t/2, yy0, yy1, u0, u1, m);
    else box(u0, u1, yy0, yy1, o.at-t/2, o.at+t/2, m);
  }
  var cur = a;
  for (var i=0;i<opens.length;i++){
    var op = opens[i];
    var u0 = op.c-op.w/2, u1 = op.c+op.w/2;
    var s = y0 + (op.sill||0), h = s + op.h;
    seg(cur, u0, y0, y1);          // pier before
    if (s > y0+0.012) seg(u0,u1, y0, s);   // sill wall
    if (h < y1-0.012) seg(u0,u1, h, y1);   // header
    addOpening(o, op, u0, u1, s, h);
    cur = u1;
  }
  seg(cur, b, y0, y1);
}
function addOpening(o, op, u0, u1, s, h){
  var t = o.thk, F = 0.055;
  function fr(x0,x1,y0,y1,z0,z1){ box(x0,x1,y0,y1,z0,z1, M.monument, true); }
  var glassM = op.type==='winOp' ? M.glassOp : M.glass;
  if (op.type==='door') return; // free walkway
  if (op.type==='leaf'){
    // timber leaf ajar (non colliding)
    var lw = (u1-u0)*0.94, lh=(h-s)*0.98;
    var leaf = bx(o.along==='z'?0.045:lw*0.75, lh, o.along==='z'?lw*0.75:0.045, op.timber?M.timber:M.white);
    if (o.along==='z') leaf.position.set(o.at+ (op.swing||0.28), s+lh/2, u0+lw*0.42);
    else leaf.position.set(u0+lw*0.42, s+lh/2, o.at+(op.swing||0.28));
    leaf.rotation.y = (o.along==='z'?1:-1)*0.6;
    house.add(leaf); return;
  }
  if (op.type==='garage'){
    if (o.along==='z') box(o.at-0.04, o.at+0.04, s, h, u0, u1, M.monument);
    else box(u0, u1, s, h, o.at-0.04, o.at+0.04, M.monument);
    // Madrid profile lines
    for (var gi=1; gi<5; gi++){
      var gy = s + gi*(h-s)/5;
      if (o.along==='z') box(o.at+0.041, o.at+0.055, gy-0.012, gy+0.012, u0+0.05, u1-0.05, M.render, true);
      else box(u0+0.05, u1-0.05, gy-0.012, gy+0.012, o.at+0.041, o.at+0.055, M.render, true);
    }
    return;
  }
  // frame (4 sticks around reveal)
  if (o.along==='z'){
    fr(o.at-F/2, o.at+F/2, s, s+0.05, u0, u1);
    fr(o.at-F/2, o.at+F/2, h-0.05, h, u0, u1);
    fr(o.at-F/2, o.at+F/2, s, h, u0, u0+0.05);
    fr(o.at-F/2, o.at+F/2, s, h, u1-0.05, u1);
  } else {
    fr(u0, u1, s, s+0.05, o.at-F/2, o.at+F/2);
    fr(u0, u1, h-0.05, h, o.at-F/2, o.at+F/2);
    fr(u0, u0+0.05, s, h, o.at-F/2, o.at+F/2);
    fr(u1-0.05, u1, s, h, o.at-F/2, o.at+F/2);
  }
  if (op.type==='glassdoor'){
    // stacked panes over 55% + open walk gap; mullion look
    var w = u1-u0, pw = w*0.55;
    if (o.along==='z'){
      box(o.at-0.018, o.at+0.018, s+0.03, h-0.03, u0+0.05, u0+0.05+pw, glassM);
      fr(o.at-F/2, o.at+F/2, s, h, u0+0.05+pw-0.03, u0+0.05+pw+0.03);
    } else {
      box(u0+0.05, u0+0.05+pw, s+0.03, h-0.03, o.at-0.018, o.at+0.018, glassM);
      fr(u0+0.05+pw-0.03, u0+0.05+pw+0.03, s, h, o.at-F/2, o.at+F/2);
    }
    return;
  }
  // window glass (collides) + mullions for wide units (1 for >1.9m, 2 for >3m)
  var nm = (u1-u0 > 3.0) ? 2 : (u1-u0 > 1.9 ? 1 : 0);
  if (o.along==='z'){
    box(o.at-0.014, o.at+0.014, s+0.04, h-0.04, u0+0.05, u1-0.05, glassM);
    for (var mi=1; mi<=nm; mi++){ var mc=u0+(u1-u0)*mi/(nm+1); fr(o.at-F/2, o.at+F/2, s, h, mc-0.025, mc+0.025); }
    if (h-s > 2.2) fr(o.at-F/2+0.005, o.at+F/2-0.005, s+(h-s)*0.62, s+(h-s)*0.62+0.05, u0, u1); // transom
  } else {
    box(u0+0.05, u1-0.05, s+0.04, h-0.04, o.at-0.014, o.at+0.014, glassM);
    for (var mj=1; mj<=nm; mj++){ var mc2=u0+(u1-u0)*mj/(nm+1); fr(mc2-0.025, mc2+0.025, s, h, o.at-F/2, o.at+F/2); }
    if (h-s > 2.2) fr(u0, u1, s+(h-s)*0.62, s+(h-s)*0.62+0.05, o.at-F/2+0.005, o.at+F/2-0.005);
  }
}

// ══════════════════════════════════════════════════════════════════
// KEY SETOUT CONSTANTS
// ══════════════════════════════════════════════════════════════════
var W_EXT=0.27, W_INT=0.11, W_FF=0.185;
var LGF=0, LGF_C=3.0, GF=3.45, GF_C=6.2, FF=6.65, FF_C=9.25, RIDGE=10.08;
var GAR=3.364, PORCH=3.364, ALF=-0.086, FB=6.564, RB=6.50, PARAPET=7.0;
var LE=6.005, LW=-6.005, LS=-9.355, LN=9.355;         // LGF faces
var LE_R=5.6;                                          // east recessed face (z<-2.03)
var NX=-3.365;                                         // west lightwell notch face
var GFN=11.665, GFS_W=-6.28;                           // GF street face / west-half garden face
var FFW=-3.345, FFE=4.915, FFS=0.095, FFN=11.665;      // FF envelope
var AX0=-5.775, AX1=0.575, AZ0=LS, AZ1=-5.355;         // alfresco void

// STAIRS — dog-leg, flights E-W, landing at west (window wall)
// LGF→GF closed risers over store; GF→FF open risers
// ══════════════════════════════════════════════════════════════════
function flight(x0, x1, z0, z1, yA, yB, open, zr0, zr1){
  // rises from x=x0(yA) to x=x1(yB) — treads; ramp registered over [zr0,zr1] if given
  var n = 10, run = x1-x0, going = run/n, rise=(yB-yA)/n;
  for (var i=0;i<n;i++){
    var tx0 = x0 + i*going, ty = yA + (i+1)*rise;
    box(tx0, tx0+going, ty-0.048, ty, z0+0.02, z1-0.02, M.tFloor, true);
    if (!open) box(tx0, tx0+going*0.98, yA + i*rise, ty-0.048, z0+0.05, z1-0.05, M.plaster, true);
    else box(tx0, tx0+going, ty-0.11, ty-0.048, z0+0.3, z1-0.3, M.darkTimber, true); // open riser stringer block
  }
  ramps.push({x0:Math.min(x0,x1), x1:Math.max(x0,x1), z0:(zr0!==undefined?zr0:z0), z1:(zr1!==undefined?zr1:z1),
              ya: (x0<x1? yA:yB), yb:(x0<x1? yB:yA)});
}
var ROWMID = (ROWS1+ROWN0)/2;
function rail(x0,y0,z0, x1,y1,z1){
  var dx=x1-x0, dy=y1-y0, dz=z1-z0, L=Math.sqrt(dx*dx+dy*dy+dz*dz);
  var g = new THREE.Mesh(new THREE.BoxGeometry(0.05,0.05,L), M.monument);
  g.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);
  g.lookAt(new THREE.Vector3(x1,y1,z1)); g.castShadow=true; house.add(g);
}

var TAN5 = Math.tan(5*Math.PI/180), TAN2 = Math.tan(2*Math.PI/180);
function skillion(x0,x1,zLow,zHigh,yLowTop,mat,thk){
  // plane along z, high at zHigh end; box rotated about X
  var L = Math.sqrt(Math.pow(zHigh-zLow,2)+Math.pow((zHigh-zLow)*TAN5,2));
  var m = bx(x1-x0, thk||0.13, L, mat);
  var yHigh = yLowTop + (zHigh-zLow)*TAN5;
  m.position.set((x0+x1)/2, (yLowTop+yHigh)/2 - (thk||0.13)/2 + (thk||0.13)/2, (zLow+zHigh)/2);
  m.rotation.x = (zHigh>zLow? -1:1)*5*Math.PI/180;
  m.castShadow = true; house.add(m);
  return m;
}

function groundY(x, z){
  var y;
  if (z >= 11.665){
    y = 3.45 + Math.min((z-11.665)*0.30, 1.5);
    if (x < -0.15 && x > -6.05){                                                // driveway lane (matches ramp exactly)
      if (z <= 13.4) y = GAR;
      else if (z <= 16.6) y = GAR + (z-13.4)*((4.5-GAR)/3.2);
      else y = 4.5;
    }
    if (x >= LE+0.0 && x < LE+1.4 && z < 12.6) y = Math.min(y, GF+0.01);        // stair top landing zone
  } else if (z <= LS){
    y = -0.09 + (z-LS)*0.045; if (y < -0.5) y = -0.5;
    if (z < -19.5 && z > -24.0 && x > 0.0 && x < 6.6) y = -0.56;  // pool terrace cut (east side per p17 site plan)
  } else {
    var f = (z-LS)/(GFN-LS);
    if (x <= -6.25){                                     // west bank, stepping up to street
      y = 0.15 + f*3.5;
      if (z < AZ1) y = Math.min(y, 0.6);                 // low beside alfresco
    }
    else if (x >= 6.0) { y = Math.max(0.0, (f-0.62)*8.5); y = Math.min(y, 3.4); }
    else y = -0.4; // under house (kept clear of wall lines so mesh faces stay outside rooms)
  }
  return y;
}
(function(){

  for (var i=0;i<pos.count;i++){
    var x = pos.getX(i), zz = -pos.getY(i); // after rotX -90: localY→ -worldZ? we set rotation so localY maps to -z
    pos.setZ(i, groundY(x, zz));
  }
  g.computeVertexNormals();
  var gm = new THREE.Mesh(g, M.lawn);
  gm.rotation.x = -Math.PI/2;

})();

function fenceSeg(xa,za,xb,zb){

    seg.position.set(mx, gy+0.9, mz);
    seg.rotation.y=Math.atan2(xb-xa, zb-za);
    seg.castShadow=true; house.add(seg);
  }
}

// so picks are applied as a per-channel RATIO against the material's post-load colour,
// relative to the group's Rev S base swatch. Works for plain and textured materials alike.
var finishBase={};
function ratioTint(mk, targetHex, baseHex){
  if (!M[mk]) return;
  if (!finishBase[mk]) finishBase[mk] = M[mk].color.clone();
  var t=new THREE.Color(targetHex), b=new THREE.Color(baseHex), o=finishBase[mk];
  M[mk].color.setRGB(
    o.r*(b.r>0.004? t.r/b.r : 1),
    o.g*(b.g>0.004? t.g/b.g : 1),

  // toilet: (wx,wz)=wall-face point at centreline, faces (dx,dz)
  function wc(wx, wz, y0, dx, dz) {

    var pan = cyl(0.17, 0.15, 0.38, white, wx + dx * 0.42, y0 + 0.19, wz + dz * 0.42);

  // shower rail + arm + rose on wall point (wx,wz), normal (dx,dz)
  function showerSet(wx, wz, dx, dz, y0) {

    cyl(0.011, 0.011, 0.34, tapM, wx + dx * 0.17, y0 + 2.05, wz + dz * 0.17,
        dz ? Math.PI / 2 : 0, dx ? Math.PI / 2 : 0);                               // arm

  }
  function niche(wx, wz, dx, dz, half, ya, yb) {

    slab(wx, wz, dx, dz, 0.0, 0.035, half, (ya + yb) / 2 - 0.01, (ya + yb) / 2 + 0.01, M.white, true);

  function mirror(wx, wz, dx, dz, half, ya, yb) {

  function towelRail(wx, wz, dx, dz, half, y) {
    if (dx !== 0) {
      cyl(0.012, 0.012, half * 2, tapM, wx + dx * 0.075, y, wz, Math.PI / 2, 0);
      cyl(0.008, 0.008, 0.08, tapM, wx + dx * 0.04, y, wz - half + 0.06, 0, Math.PI / 2);
      cyl(0.008, 0.008, 0.08, tapM, wx + dx * 0.04, y, wz + half - 0.06, 0, Math.PI / 2);
    } else {
      cyl(0.012, 0.012, half * 2, tapM, wx, y, wz + dz * 0.075, 0, Math.PI / 2);
      cyl(0.008, 0.008, 0.08, tapM, wx - half + 0.06, y, wz + dz * 0.04, Math.PI / 2, 0);
      cyl(0.008, 0.008, 0.08, tapM, wx + half - 0.06, y, wz + dz * 0.04, Math.PI / 2, 0);

  }

  // ================= 1) LGF BATH  (x 1.895..5.6, z 3.92..5.77, y0=0) =================

    basin(3.33, ty, 0.87); basin(4.19, ty, 0.87);

    wc(2.345, 1.115, y0, 0, -1);                              // west end, 450 off the west wall, backs the WIL wall
    // shower west end x 1.92..3.18 (door at 4.27 per DXF, so wet zone flips west)
    box(3.765, 5.33, y0 + 0.005, y0 + 0.03, 1.225, 2.785, M.wetTile, true); // shower tray in the around-the-corner leg (p9: 1650x1450)
    showerSet(3.765, 2.0, 1, 0, y0);                           // rose on the leg west wall
    niche(4.55, 2.785, 0, -1, 0.35, y0 + 1.00, y0 + 1.55);     // leg north wall niche
    towelRail(1.905, 0.2, 1, 0, 0.35, y0 + 1.15);              // west wall
  })();

  // ================= 3) GF BATH  (x 1.895..5.6, z 2.895..5.175, y0=3.45) =================
  (function () {
    var y0 = 3.45;
    // freestanding 1500 tub against east wall (lathe, scaled oval)
    var pts = [
      new THREE.Vector2(0.001, 0.03), new THREE.Vector2(0.30, 0.03),
      new THREE.Vector2(0.46, 0.09),  new THREE.Vector2(0.52, 0.30),
      new THREE.Vector2(0.535, 0.52), new THREE.Vector2(0.55, 0.565),
      new THREE.Vector2(0.52, 0.585), new THREE.Vector2(0.47, 0.575),
      new THREE.Vector2(0.44, 0.52),  new THREE.Vector2(0.42, 0.30),
      new THREE.Vector2(0.36, 0.15),  new THREE.Vector2(0.22, 0.10),
      new THREE.Vector2(0.001, 0.10)
    ];
    var tub = new THREE.Mesh(new THREE.LatheGeometry(pts, 28), tubM);
    tub.position.set(4.09, y0, 3.90);   // mid-room, clear of the east shower strip (p9)
    tub.scale.set(0.375 / 0.55, 1, 0.75 / 0.55);               // x 4.55..5.3 , z 3.0..4.5
    tub.castShadow = tub.receiveShadow = true;
    house.add(tub);
    // floor-standing bath filler beside tub
    cyl(0.018, 0.02, 0.95, tapM, 3.58, y0 + 0.475, 3.90);
    cyl(0.013, 0.013, 0.22, tapM, 3.69, y0 + 0.91, 3.90, 0, Math.PI / 2);
    cyl(0.011, 0.011, 0.05, tapM, 3.79, y0 + 0.885, 3.90);
    var ty = vanity(1.925, 3.625, 2.91, 3.38, y0);             // V1700 from the west corner (p9)
    basin(2.70, ty, 3.15);
    tap(2.70, ty + 0.27, 2.905, 0, 1);
    mirror(2.70, 2.905, 0, 1, 0.70, ty + 0.35, ty + 1.10);
    wc(2.345, 5.875, y0, 0, -1);                               // in the WC nook, backs the guest-front wall
    box(4.735, 5.735, y0 + 0.005, y0 + 0.03, 2.895, 5.175, M.wetTile, true); // shower strip along the east wall (p9, W10 over)
    box(4.723, 4.747, y0 + 0.03, y0 + 2.03, 2.895, 4.45, M.glass);            // screen (entry gap at south end)
    showerSet(5.23, 2.895, 0, 1, y0);
    towelRail(3.6, 5.16, 0, -1, 0.35, y0 + 1.15);              // south wall, east of the WC nook
  })();

  // ================= 4) FF POWDER + SHOWER  (x -3.16..-1.27, z 5.185..7.075, y0=6.65) =================
  // p10 (ffB_powder crop): a wet room — shower (west, -15mm FALL, rose on the window wall),
  // WC, and a V1200 vanity + basin. Door in the east wall at z 5.29..6.11.
  (function () {
    var y0 = 6.65;
    // V1200 vanity on the street wall (z7.075), basin + tap facing garden (-z)
    var ty = vanity(-3.16, -1.96, 6.615, 7.075, y0);
    basin(-2.56, ty, 6.85);
    tap(-2.56, ty + 0.27, 7.07, 0, -1);
    mirror(-2.56, 7.07, 0, -1, 0.60, ty + 0.35, ty + 1.10);
    // WC on the street wall, east of the vanity, facing garden
    wc(-1.55, 7.075, y0, 0, -1);
    // shower in the garden-west corner (rose on the west window wall, FALL to waste)
    box(-3.16, -2.30, y0 + 0.005, y0 + 0.03, 5.185, 6.05, M.wetTile, true);   // tray, -15mm recess
    box(-2.324, -2.30, y0 + 0.03, y0 + 2.03, 5.185, 6.05, M.glass);           // screen east
    box(-3.16, -2.30, y0 + 0.03, y0 + 2.03, 6.026, 6.05, M.glass);            // screen garden (entry gap at the corner)
    showerSet(-3.16, 5.6, 1, 0, y0);                                          // rose on the west window wall
    niche(-3.16, 5.9, 1, 0, 0.20, y0 + 1.0, y0 + 1.5);
    var ring = new THREE.Mesh(new THREE.TorusGeometry(0.085, 0.011, 10, 24), tapM);
    ring.position.set(-1.35, y0 + 1.20, 6.4);                 // towel ring, east wall (street side of the door)
    ring.castShadow = ring.receiveShadow = true;

// ══════════════════════════════════════════════════════════════════
var walk = {on:false, x:1.2, y:5.0, z:15.5, yaw:Math.PI, pitch:0, vy:0, keys:{},
            tYaw:Math.PI, tPitch:0, vx:0, vz:0};
var cross=document.getElementById('cross'), whelp=document.getElementById('walkhelp');
function enterWalk(){
  walk.on=true; controls.enabled=false;
  walk.x=1.3; walk.z=14.6; walk.y=groundY(1.3,14.6)+1.6; walk.yaw=Math.PI; walk.pitch=-0.05;
  walk.tYaw=walk.yaw; walk.tPitch=walk.pitch; walk.vy=0; walk.vx=0; walk.vz=0;
  renderer.domElement.requestPointerLock && renderer.domElement.requestPointerLock();
  cross.style.display='block'; whelp.style.display='block';
}
function exitWalk(){
  if (!walk.on) return;
  walk.on=false; controls.enabled=true;
  document.exitPointerLock && document.exitPointerLock();
  cross.style.display='none'; whelp.style.display='none';
}
document.addEventListener('pointerlockchange', function(){
  if (!document.pointerLockElement && walk.on && !isTouch) exitWalk();
});
document.addEventListener('mousemove', function(e){
  if (!walk.on || !document.pointerLockElement) return;
  // clamp per-event spikes (pointer-lock re-acquire / OS glitches cause huge deltas)
  var mx = Math.max(-45, Math.min(45, e.movementX));
  var my = Math.max(-45, Math.min(45, e.movementY));
  walk.tYaw   -= mx*0.0019;
  walk.tPitch -= my*0.0019;
  walk.tPitch = Math.max(-1.45, Math.min(1.45, walk.tPitch));
});
document.addEventListener('keydown', function(e){ walk.keys[e.code]=true; });
document.addEventListener('keyup',   function(e){ walk.keys[e.code]=false; });
// touch controls (left = move, right = look)
var isTouch=false, tMove=null, tLook=null;
renderer.domElement.addEventListener('touchstart', function(e){
  if (!walk.on) return; isTouch=true;
  for (var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i];
    if (t.clientX < innerWidth/2 && !tMove) tMove={id:t.identifier, x0:t.clientX, y0:t.clientY, dx:0, dy:0};
    else if (!tLook) tLook={id:t.identifier, x:t.clientX, y:t.clientY};
  }
  e.preventDefault();
}, {passive:false});
renderer.domElement.addEventListener('touchmove', function(e){
  if (!walk.on) return;
  for (var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i];
    if (tMove && t.identifier===tMove.id){ tMove.dx=(t.clientX-tMove.x0)/50; tMove.dy=(t.clientY-tMove.y0)/50; }
    if (tLook && t.identifier===tLook.id){
      walk.tYaw -= (t.clientX-tLook.x)*0.005; walk.tPitch -= (t.clientY-tLook.y)*0.005;
      walk.tPitch=Math.max(-1.45,Math.min(1.45,walk.tPitch));
      tLook.x=t.clientX; tLook.y=t.clientY;
    }
  }
  e.preventDefault();
}, {passive:false});
renderer.domElement.addEventListener('touchend', function(e){
  for (var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i];
    if (tMove && t.identifier===tMove.id) tMove=null;
    if (tLook && t.identifier===tLook.id) tLook=null;
  }
});
// floor solver
var STEP_UP = 0.62;
function floorAt(x, z, footY){
  var best=-1e9, cand;
  cand = groundY(x,z); if (cand<=footY+STEP_UP && cand>best) best=cand;
  for (var i=0;i<slabs.length;i++){
    var s=slabs[i];
    if (x>=s.x0-0.05 && x<=s.x1+0.05 && z>=s.z0-0.05 && z<=s.z1+0.05){
      if (s.y<=footY+STEP_UP && s.y>best) best=s.y;
    }
  }
  for (var j=0;j<ramps.length;j++){
    var r=ramps[j];
    if (x>=r.x0-0.03 && x<=r.x1+0.03 && z>=r.z0-0.03 && z<=r.z1+0.03){
      var f=(x-r.x0)/(r.x1-r.x0); f=Math.max(0,Math.min(1,f));
      var yy=r.ya+(r.yb-r.ya)*f;
      if (yy<=footY+STEP_UP && yy>best) best=yy;
    }
  }
  for (var k=0;k<rampsZ.length;k++){
    var rz=rampsZ[k];
    if (x>=rz.x0-0.03 && x<=rz.x1+0.03 && z>=rz.z0-0.03 && z<=rz.z1+0.03){
      var fz=(z-rz.z0)/(rz.z1-rz.z0); fz=Math.max(0,Math.min(1,fz));
      var yz=rz.ya+(rz.yb-rz.ya)*fz;
      if (yz<=footY+STEP_UP && yz>best) best=yz;
    }
  }
  return best;
}
// axis-separated sliding collision: move in x, resolve; move in z, resolve.
// Walking into a wall at an angle slides along it; doorways don't snag.
var PR = 0.24; // player radius
function hitsAt(px, pz, footY){
  var b0 = footY+0.35, b1 = footY+1.72;
  for (var i=0;i<colliders.length;i++){
    var c=colliders[i];
    if (b1 < c.y0+0.05 || b0 > c.y1-0.02) continue;
    if (px > c.x0-PR && px < c.x1+PR && pz > c.z0-PR && pz < c.z1+PR) return c;
  }
  return null;
}
function slideMove(px, pz, dx, dz, footY){
  // X axis
  var nx = px + dx, c = hitsAt(nx, pz, footY);
  if (c){ nx = (dx > 0) ? c.x0-PR-0.001 : c.x1+PR+0.001;
          if (hitsAt(nx, pz, footY)) nx = px; }
  // Z axis
  var nz = pz + dz; c = hitsAt(nx, nz, footY);
  if (c){ nz = (dz > 0) ? c.z0-PR-0.001 : c.z1+PR+0.001;
          if (hitsAt(nx, nz, footY)) nz = pz; }
  return [nx, nz];
}
var clock=new THREE.Clock();
function stepWalk(dt){
  dt = Math.min(dt, 0.033);
  // smoothed look: exponential approach to the target yaw/pitch
  var lk = 1 - Math.exp(-dt*22);
  walk.yaw   += (walk.tYaw - walk.yaw)*lk;
  walk.pitch += (walk.tPitch - walk.pitch)*lk;
  // input direction
  var sp = (walk.keys['ShiftLeft']||walk.keys['ShiftRight']) ? 6.2 : 3.4;
  var mx=0, mz=0;
  if (walk.keys['KeyW']||walk.keys['ArrowUp']) mz+=1;
  if (walk.keys['KeyS']||walk.keys['ArrowDown']) mz-=1;
  if (walk.keys['KeyA']||walk.keys['ArrowLeft']) mx-=1;
  if (walk.keys['KeyD']||walk.keys['ArrowRight']) mx+=1;
  if (tMove){ mx+=Math.max(-1,Math.min(1,tMove.dx)); mz-=Math.max(-1,Math.min(1,tMove.dy)); }
  var len=Math.hypot(mx,mz)||1;
  var fx=-Math.sin(walk.yaw), fz=-Math.cos(walk.yaw);
  var rx=-fz, rz=fx;
  // smoothed velocity (accelerate/decelerate) — removes start/stop jerk
  var wvx = (fx*mz/len + rx*mx/len)*sp, wvz = (fz*mz/len + rz*mx/len)*sp;
  var ak = 1 - Math.exp(-dt*12);
  walk.vx += (wvx - walk.vx)*ak;
  walk.vz += (wvz - walk.vz)*ak;
  var foot = walk.y-1.6;
  var res = slideMove(walk.x, walk.z, walk.vx*dt, walk.vz*dt, foot);
  var nxp=res[0], nzp=res[1];
  var fl = floorAt(nxp, nzp, foot);
  if (fl < -100) fl = foot;
  var targetY = fl+1.6;
  if (walk.y > targetY+0.02){ walk.vy -= 16*dt; walk.y += walk.vy*dt; if (walk.y<targetY){walk.y=targetY; walk.vy=0;} }
  else { walk.y += (targetY-walk.y)*Math.min(1, dt*12); walk.vy=0; }
  walk.x=nxp; walk.z=nzp;
  camera.position.set(walk.x, walk.y, walk.z);
  camera.lookAt(walk.x + fx*Math.cos(walk.pitch), walk.y + Math.sin(walk.pitch), walk.z + fz*Math.cos(walk.pitch));
}
function animate(){
  requestAnimationFrame(animate);
  var dt=Math.min(clock.getDelta(), 0.05);
  if (walk.on) stepWalk(dt);
  else controls.update();
  renderer.render(scene, camera);
}
animate();
window.addEventListener('resize', function(){
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
