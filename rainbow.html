<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rainbow Zones — Kirribilli</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0b0f14; color: #eaeef3; }
  #map { position: absolute; inset: 0; }

  .panel {
    position: absolute; z-index: 500;
    background: rgba(10, 14, 20, 0.88);
    border: 1px solid #2a3340;
    border-radius: 8px;
    padding: 12px 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    backdrop-filter: blur(6px);
  }
  #info { top: 12px; left: 12px; max-width: 320px; font-size: 13px; line-height: 1.5; }
  #info h1 { margin: 0 0 6px; font-size: 15px; font-weight: 600; }
  #info .score-bar { height: 8px; border-radius: 4px; background: #1b2330; overflow: hidden; margin: 6px 0; }
  #info .score-fill { height: 100%; background: linear-gradient(90deg, #6e3bd1, #2b6cff, #1ec27a, #ffd33d, #ff7a3d, #ff3d6e); transition: width 0.3s; }
  #info .row { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: #b9c2cf; }
  #info .row b { color: #eaeef3; font-weight: 500; }
  #info .verdict { font-size: 13px; font-weight: 600; margin-top: 8px; padding: 6px 8px; border-radius: 4px; }
  #info .verdict.good { background: rgba(30, 194, 122, 0.15); color: #5ee3a4; }
  #info .verdict.mid { background: rgba(255, 211, 61, 0.15); color: #ffd33d; }
  #info .verdict.bad { background: rgba(255, 61, 110, 0.12); color: #ff7a8a; }

  #timeline { bottom: 12px; left: 12px; right: 12px; padding: 10px 14px; }
  #timeline .ticks { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px; }
  #timeline .tick {
    flex: 0 0 auto; min-width: 64px; padding: 6px 8px; border-radius: 4px;
    background: #131a23; border: 1px solid #2a3340; cursor: pointer;
    font-size: 11px; line-height: 1.3; text-align: center; transition: border-color 0.15s;
  }
  #timeline .tick.active { border-color: #ffd33d; }
  #timeline .tick .t-time { color: #b9c2cf; font-size: 10px; }
  #timeline .tick .t-score { font-weight: 600; margin-top: 2px; }
  #timeline .tick .t-bar { height: 3px; border-radius: 2px; background: #2a3340; margin-top: 4px; overflow: hidden; }
  #timeline .tick .t-bar > span { display: block; height: 100%; background: linear-gradient(90deg, #2b6cff, #ffd33d, #ff3d6e); }

  .leaflet-container { background: #0b0f14; }
  /* Tone down OSM tiles for the dark theme; don't filter the radar overlay */
  .leaflet-pane.basemap-pane .leaflet-tile { filter: brightness(0.65) saturate(0.8) hue-rotate(180deg) invert(0.92); }

  .sun-icon, .anti-icon { display: flex; align-items: center; justify-content: center; font-size: 18px; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }

  #radar { top: 12px; right: 12px; width: 240px; }
  #radar .row1 { display: flex; align-items: center; gap: 8px; }
  #radar button { background: #131a23; color: #eaeef3; border: 1px solid #2a3340; border-radius: 4px; padding: 4px 8px; font-size: 12px; cursor: pointer; }
  #radar button:hover { border-color: #8fb8ff; }
  #radar .ts { font-size: 12px; font-variant-numeric: tabular-nums; flex: 1; }
  #radar .ts.nowcast { color: #ffd33d; }
  #radar .scrub { width: 100%; margin-top: 8px; accent-color: #8fb8ff; }
  #radar .label { font-size: 10px; color: #6f7a8a; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
  #radar .legend { display: flex; gap: 6px; margin-top: 6px; font-size: 10px; color: #b9c2cf; }
  #radar .legend .sw { width: 14px; height: 10px; border-radius: 2px; display: inline-block; vertical-align: middle; margin-right: 3px; }
</style>
</head>
<body>
<div id="map"></div>

<div id="info" class="panel">
  <h1>🌈 Rainbow Zones — Kirribilli</h1>
  <div class="row"><span>Sun</span><b id="sun-az">—</b></div>
  <div class="row"><span>Antisolar bearing</span><b id="anti-az">—</b></div>
  <div class="row"><span>Rain (last 1h)</span><b id="rain">—</b></div>
  <div class="row"><span>Cloud cover</span><b id="cloud">—</b></div>
  <div class="row"><span>Conditions</span><b id="cond">—</b></div>
  <div class="row"><span>Showing</span><b id="showing-time">now</b></div>
  <div style="margin-top:8px">
    <div class="row"><span>Rainbow probability</span><b id="score-pct">—</b></div>
    <div class="score-bar"><div class="score-fill" id="score-fill" style="width:0"></div></div>
  </div>
  <div class="verdict" id="verdict">Loading…</div>
</div>

<div id="radar" class="panel">
  <div class="label">Rain radar (RainViewer)</div>
  <div class="row1">
    <button id="play-btn" title="Play / pause">⏸︎</button>
    <span class="ts" id="radar-ts">loading…</span>
  </div>
  <input type="range" class="scrub" id="radar-scrub" min="0" max="0" value="0" />
  <div class="legend">
    <span><span class="sw" style="background:#3b6fcc"></span>light</span>
    <span><span class="sw" style="background:#4fbf52"></span>moderate</span>
    <span><span class="sw" style="background:#ffd33d"></span>heavy</span>
    <span><span class="sw" style="background:#ff3d6e"></span>intense</span>
  </div>
</div>

<div id="timeline" class="panel">
  <div style="font-size:11px; color:#b9c2cf; margin-bottom:6px; text-transform:uppercase; letter-spacing:0.04em;">Forecast — tap a step to preview · 3 h apart</div>
  <div class="ticks" id="ticks"><span style="color:#6f7a8a; font-size:12px;">Loading forecast…</span></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/suncalc@1.9.0/suncalc.js"></script>
<script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
<script>
// ---- Constants ----------------------------------------------------------
const KIRRIBILLI = [-33.8472, 151.2169]; // [lat, lon]
const RADIUS_KM = 10;
const PRIMARY_BOW_DEG = 42;
const OWM_API_KEY = "b3f030048e470e6f1f567401ad06b09d";

// ---- Map setup ----------------------------------------------------------
const map = L.map("map", { zoomControl: true }).setView(KIRRIBILLI, 10);
map.createPane("basemap-pane");
map.getPane("basemap-pane").style.zIndex = 200;
map.createPane("radar-pane");
map.getPane("radar-pane").style.zIndex = 350;
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenStreetMap",
  pane: "basemap-pane",
  maxZoom: 19
}).addTo(map);

let observer = KIRRIBILLI.slice();
const radiusCircle = L.circle(observer, {
  radius: RADIUS_KM * 1000,
  color: "#8fb8ff", weight: 1.5, fillOpacity: 0.04, dashArray: "4 4"
}).addTo(map).bindTooltip("10 km viewing radius");

const observerMarker = L.marker(observer, {
  draggable: true,
  icon: L.divIcon({ html: "📍", className: "sun-icon", iconSize: [24,24] })
}).addTo(map).bindTooltip("Drag to move observer");

observerMarker.on("dragend", e => {
  const ll = e.target.getLatLng();
  observer = [ll.lat, ll.lng];
  radiusCircle.setLatLng(ll);
  state.selectedIndex = null;
  loadWeather(OWM_API_KEY);
});

const state = { current: null, forecast: [], selectedIndex: null };

let sunMarker = null;
let antiMarker = null;
let rainbowWedge = null;

// ---- Solar geometry -----------------------------------------------------
function sunInfo(date, lat, lon) {
  const p = SunCalc.getPosition(date, lat, lon);
  // SunCalc azimuth: radians, measured FROM SOUTH, westward positive.
  // Convert to compass (from north, clockwise).
  const azDeg = (p.azimuth * 180 / Math.PI + 180 + 360) % 360;
  const elDeg = p.altitude * 180 / Math.PI;
  return { az: azDeg, el: elDeg };
}

function antisolarBearing(sunAzDeg) {
  return (sunAzDeg + 180) % 360;
}

// Project a bearing+distance from a lat/lon -> [lat,lon]
function destPoint(lat, lon, bearingDeg, distKm) {
  const R = 6371;
  const br = bearingDeg * Math.PI / 180;
  const lat1 = lat * Math.PI / 180;
  const lon1 = lon * Math.PI / 180;
  const lat2 = Math.asin(Math.sin(lat1) * Math.cos(distKm / R) +
                         Math.cos(lat1) * Math.sin(distKm / R) * Math.cos(br));
  const lon2 = lon1 + Math.atan2(Math.sin(br) * Math.sin(distKm / R) * Math.cos(lat1),
                                  Math.cos(distKm / R) - Math.sin(lat1) * Math.sin(lat2));
  return [lat2 * 180 / Math.PI, ((lon2 * 180 / Math.PI) + 540) % 360 - 180];
}

// Build a wedge polygon: observer + arc of bearings around antisolar, radius=RADIUS_KM
function buildRainbowWedge(lat, lon, antiBearing, halfWidthDeg, distKm) {
  const pts = [[lat, lon]];
  const steps = 24;
  for (let i = 0; i <= steps; i++) {
    const b = antiBearing - halfWidthDeg + (2 * halfWidthDeg * i / steps);
    pts.push(destPoint(lat, lon, b, distKm));
  }
  pts.push([lat, lon]);
  return pts;
}

// ---- Probability score --------------------------------------------------
function score(sunEl, rainMm, cloudPct, date, lat, lon) {
  // 1. Sun elevation: 0 if hidden or too high; peaks at horizon, falls to 0 at 42°.
  let S_sun = 0;
  if (sunEl > 0 && sunEl < PRIMARY_BOW_DEG) S_sun = 1 - (sunEl / PRIMARY_BOW_DEG);

  // 2. Rain: peak in light-rain band 0.1–2.5 mm/h, decay to 0 by 10 mm/h.
  let S_rain = 0;
  if (rainMm >= 0.1 && rainMm <= 2.5) S_rain = 1;
  else if (rainMm > 2.5 && rainMm < 10) S_rain = 1 - (rainMm - 2.5) / 7.5;
  else if (rainMm > 0 && rainMm < 0.1) S_rain = rainMm / 0.1; // ramp-in for drizzle

  // 3. Clouds: triangular peak at 50%.
  let S_cloud = 0;
  if (cloudPct >= 0 && cloudPct <= 100) {
    S_cloud = 1 - Math.abs(cloudPct - 50) / 50;
  }

  // 4. Time: 1 within 2h of sunrise/sunset, decays linearly out to 4h.
  const times = SunCalc.getTimes(date, lat, lon);
  const minsFromEdge = Math.min(
    Math.abs(date - times.sunrise),
    Math.abs(date - times.sunset)
  ) / 60000;
  let S_time = 0;
  if (minsFromEdge <= 120) S_time = 1;
  else if (minsFromEdge < 240) S_time = 1 - (minsFromEdge - 120) / 120;

  const P = 0.35 * S_sun + 0.30 * S_rain + 0.25 * S_cloud + 0.10 * S_time;
  return { P, S_sun, S_rain, S_cloud, S_time };
}

function verdictFor(P, sunEl) {
  if (sunEl <= 0) return { text: "Sun below horizon — no rainbow possible right now.", cls: "bad" };
  if (sunEl >= PRIMARY_BOW_DEG) return { text: `Sun too high (${sunEl.toFixed(0)}°) — bow would be below horizon.`, cls: "bad" };
  if (P > 0.55) return { text: "Strong rainbow potential — check the eastern sector!", cls: "good" };
  if (P > 0.30) return { text: "Possible — keep an eye on the antisolar direction.", cls: "mid" };
  return { text: "Unlikely right now. Check the timeline for better windows.", cls: "bad" };
}

// ---- Render -------------------------------------------------------------
function snapshotFromCurrent(w) {
  if (!w) return null;
  return {
    rain: w.rain?.["1h"] || w.rain?.["3h"] || 0,
    cloud: w.clouds?.all ?? 0,
    cond: w.weather?.[0]?.description ?? "—"
  };
}
function snapshotFromForecastRow(r) {
  return {
    rain: (r.rain?.["3h"] || 0) / 3,
    cloud: r.clouds?.all ?? 0,
    cond: r.weather?.[0]?.description ?? "—"
  };
}

function renderForState(date, snap) {
  const s = sunInfo(date, observer[0], observer[1]);
  const anti = antisolarBearing(s.az);

  document.getElementById("sun-az").textContent =
    `${s.az.toFixed(0)}° az · ${s.el.toFixed(1)}° el`;
  document.getElementById("anti-az").textContent = `${anti.toFixed(0)}°`;

  if (sunMarker) map.removeLayer(sunMarker);
  if (antiMarker) map.removeLayer(antiMarker);
  if (s.el > 0) {
    const sunPt = destPoint(observer[0], observer[1], s.az, 8);
    sunMarker = L.marker(sunPt, {
      icon: L.divIcon({ html: "☀️", className: "sun-icon", iconSize: [24,24] })
    }).addTo(map).bindTooltip(`Sun bearing ${s.az.toFixed(0)}°`);
    const antiPt = destPoint(observer[0], observer[1], anti, 8);
    antiMarker = L.marker(antiPt, {
      icon: L.divIcon({ html: "🌈", className: "anti-icon", iconSize: [24,24] })
    }).addTo(map).bindTooltip(`Antisolar (look here) ${anti.toFixed(0)}°`);
  }

  if (rainbowWedge) map.removeLayer(rainbowWedge);
  if (s.el > 0 && s.el < PRIMARY_BOW_DEG) {
    const pts = buildRainbowWedge(observer[0], observer[1], anti, 50, RADIUS_KM);
    rainbowWedge = L.polygon(pts, {
      color: "#ffd33d", weight: 1.5, fillColor: "#ffd33d", fillOpacity: 0.10
    }).addTo(map).bindTooltip("Rainbow viewing sector (~100° wide, opposite the sun)");
  }

  const rain = snap ? snap.rain : 0;
  const cloud = snap ? snap.cloud : 0;
  const cond = snap ? snap.cond : "—";
  document.getElementById("rain").textContent = `${rain.toFixed(2)} mm`;
  document.getElementById("cloud").textContent = `${cloud}%`;
  document.getElementById("cond").textContent = cond;

  const sc = score(s.el, rain, cloud, date, observer[0], observer[1]);
  const pct = Math.round(sc.P * 100);
  document.getElementById("score-pct").textContent = `${pct}%`;
  document.getElementById("score-fill").style.width = `${pct}%`;
  const v = verdictFor(sc.P, s.el);
  const ve = document.getElementById("verdict");
  ve.textContent = v.text;
  ve.className = "verdict " + v.cls;

  const showingEl = document.getElementById("showing-time");
  if (state.selectedIndex === null) {
    showingEl.innerHTML = "now";
  } else {
    const hh = date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    const dh = date.toLocaleDateString([], { weekday: "short" });
    showingEl.innerHTML = `${dh} ${hh} <a href="#" id="clear-sel" style="color:#8fb8ff;margin-left:4px">×</a>`;
    document.getElementById("clear-sel").addEventListener("click", e => {
      e.preventDefault();
      clearSelection();
    });
  }
}

function refresh() {
  if (state.selectedIndex !== null && state.forecast[state.selectedIndex]) {
    const row = state.forecast[state.selectedIndex];
    renderForState(new Date(row.dt * 1000), snapshotFromForecastRow(row));
  } else {
    renderForState(new Date(), snapshotFromCurrent(state.current));
  }
  renderForecastTicks();
}

function selectStep(i) {
  state.selectedIndex = i;
  refresh();
  const t = state.forecast[i]?.dt;
  if (t && radarState.frames.length) {
    let bestIdx = -1, bestDelta = Infinity;
    radarState.frames.forEach((f, k) => {
      const d = Math.abs(f.time - t);
      if (d < bestDelta) { bestDelta = d; bestIdx = k; }
    });
    if (bestDelta <= 30 * 60) {
      pauseRadar();
      showRadarFrame(bestIdx);
    }
  }
}

function clearSelection() {
  state.selectedIndex = null;
  refresh();
}

function renderForecastTicks() {
  const ticksEl = document.getElementById("ticks");
  if (!state.forecast.length) {
    ticksEl.innerHTML = '<span style="color:#6f7a8a; font-size:12px;">Loading forecast…</span>';
    return;
  }
  ticksEl.innerHTML = "";
  state.forecast.slice(0, 8).forEach((row, i) => {
    const d = new Date(row.dt * 1000);
    const s = sunInfo(d, observer[0], observer[1]);
    const rain = row.rain?.["3h"] || 0;
    const cloud = row.clouds?.all ?? 0;
    const sc = score(s.el, rain / 3, cloud, d, observer[0], observer[1]);
    const pct = Math.round(sc.P * 100);
    const hh = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    const dh = d.toLocaleDateString([], { weekday: "short" });
    const tick = document.createElement("div");
    tick.className = "tick" + (state.selectedIndex === i ? " active" : "");
    tick.innerHTML = `
      <div class="t-time">${dh} ${hh}</div>
      <div class="t-score">${pct}%</div>
      <div class="t-bar"><span style="width:${pct}%"></span></div>
    `;
    tick.title = `Sun ${s.el.toFixed(0)}° el · ${cloud}% cloud · ${(rain/3).toFixed(2)} mm/h rain`;
    tick.addEventListener("click", () => selectStep(i));
    ticksEl.appendChild(tick);
  });
}

// ---- RainViewer radar ---------------------------------------------------
const radarState = { frames: [], idx: 0, layer: null, timer: null, playing: true, nowcastStart: 0 };

function initRadarControls() {
  const scrub = document.getElementById("radar-scrub");
  scrub.addEventListener("input", e => {
    pauseRadar();
    showRadarFrame(parseInt(e.target.value, 10));
  });
  document.getElementById("play-btn").addEventListener("click", toggleRadar);
}

async function loadRainViewer() {
  try {
    const res = await fetch("https://api.rainviewer.com/public/weather-maps.json");
    const data = await res.json();
    const past = (data.radar?.past || []).map(f => ({ ...f, host: data.host, kind: "past" }));
    const nowcast = (data.radar?.nowcast || []).map(f => ({ ...f, host: data.host, kind: "nowcast" }));
    const wasAtLive = radarState.frames.length === 0 ||
                       radarState.idx === radarState.nowcastStart - 1;
    radarState.frames = [...past, ...nowcast];
    radarState.nowcastStart = past.length;
    radarState.idx = wasAtLive
      ? Math.max(0, past.length - 1)
      : Math.min(radarState.idx, radarState.frames.length - 1);

    const scrub = document.getElementById("radar-scrub");
    scrub.max = String(radarState.frames.length - 1);
    scrub.value = String(radarState.idx);

    showRadarFrame(radarState.idx);
    if (radarState.playing) playRadar();
  } catch (e) {
    console.error("RainViewer load failed", e);
    document.getElementById("radar-ts").textContent = "radar unavailable";
  }
}

function showRadarFrame(i) {
  if (!radarState.frames.length) return;
  radarState.idx = (i + radarState.frames.length) % radarState.frames.length;
  const f = radarState.frames[radarState.idx];
  if (radarState.layer) map.removeLayer(radarState.layer);
  // color 2 = Universal Blue, smoothing on, no snow
  const url = `${f.host}${f.path}/256/{z}/{x}/{y}/2/1_1.png`;
  radarState.layer = L.tileLayer(url, {
    opacity: 0.75, pane: "radar-pane", attribution: "© RainViewer"
  }).addTo(map);

  const ts = document.getElementById("radar-ts");
  const d = new Date(f.time * 1000);
  const hh = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  const deltaMin = Math.round((f.time * 1000 - Date.now()) / 60000);
  if (f.kind === "nowcast") {
    ts.textContent = `+${deltaMin} min · ${hh} (nowcast)`;
    ts.classList.add("nowcast");
  } else {
    ts.textContent = deltaMin === 0 ? `now · ${hh}` : `${deltaMin} min · ${hh}`;
    ts.classList.remove("nowcast");
  }
  document.getElementById("radar-scrub").value = String(radarState.idx);
}

function playRadar() {
  radarState.playing = true;
  document.getElementById("play-btn").textContent = "⏸︎";
  clearInterval(radarState.timer);
  radarState.timer = setInterval(() => showRadarFrame(radarState.idx + 1), 500);
}
function pauseRadar() {
  radarState.playing = false;
  document.getElementById("play-btn").textContent = "▶︎";
  clearInterval(radarState.timer);
}
function toggleRadar() { radarState.playing ? pauseRadar() : playRadar(); }

// ---- OpenWeather --------------------------------------------------------
async function loadWeather(key) {
  const base = "https://api.openweathermap.org/data/2.5";
  const q = `lat=${observer[0]}&lon=${observer[1]}&units=metric&appid=${key}`;
  try {
    const [nowRes, fcRes] = await Promise.all([
      fetch(`${base}/weather?${q}`),
      fetch(`${base}/forecast?${q}`)
    ]);
    if (!nowRes.ok || !fcRes.ok) {
      throw new Error(`HTTP ${nowRes.status} / ${fcRes.status}`);
    }
    state.current = await nowRes.json();
    const fc = await fcRes.json();
    state.forecast = fc.list || [];
    refresh();
  } catch (e) {
    console.error(e);
    document.getElementById("verdict").textContent =
      "Couldn't load OpenWeather. Check the API key (new keys take ~10 min to activate).";
    document.getElementById("verdict").className = "verdict bad";
    state.current = null;
    refresh();
  }
}

// ---- Boot ---------------------------------------------------------------
initRadarControls();
refresh(); // render wedge/sun immediately, before weather arrives
loadWeather(OWM_API_KEY);
loadRainViewer();

// Refresh weather every 5 min; refresh radar manifest every 5 min
setInterval(() => loadWeather(OWM_API_KEY), 5 * 60 * 1000);
setInterval(() => loadRainViewer(), 5 * 60 * 1000);
</script>
</body>
</html>
